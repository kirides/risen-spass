# src/modkit/app/panels/events_panel.cpp:161
"A graph starts at a trigger (green) and runs along its links. A Condition goes on at 'then' or 'else'. An output linked to several nodes runs them all, top to bottom. Once, After N passes and Cooldown keep their state in the savegame; a Delay too. Variables are game variables (dialogues and quests can read them) or mod variables kept in the savegame." = "Ein Graph beginnt an einem Auslöser (grün) und läuft entlang seiner Verknüpfungen. Eine Bedingung geht bei „then“ oder „else“ weiter. Ein Ausgang, der mit mehreren Knoten verknüpft ist, führt sie alle von oben nach unten aus. „Einmal“, „Nach N Durchgängen“ und „Abkühlzeit“ behalten ihren Zustand im Spielstand; „Verzögerung“ ebenso. Variablen sind Spielvariablen (Dialoge und Quests können sie lesen) oder Mod-Variablen, die im Spielstand gehalten werden."
