"The flow starts at Start and walks the chain: an Objective waits until the player did it, a Log entry and a Reward happen at once, an Outcome ends the quest (success, failure, cancelled) and may start a follow-up quest. A quest without a Start is ended by its dialogues alone. An Either / or lets the player choose by doing: link the first Objective of each way to its output, the first one completed decides the path." = "Der Ablauf beginnt bei Start und folgt der Kette: Ein Ziel wartet, bis der Spieler es erledigt hat, ein Logeintrag und eine Belohnung geschehen sofort, ein Ergebnis beendet die Quest (Erfolg, Misserfolg, abgebrochen) und kann eine Folgequest starten. Eine Quest ohne Start wird allein durch ihre Dialoge beendet. Ein Entweder / oder lässt den Spieler durch Handeln wählen: verknüpfe das erste Ziel jedes Wegs mit seinem Ausgang, das zuerst erledigte entscheidet den Weg."
