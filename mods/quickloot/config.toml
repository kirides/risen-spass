# Quick Loot options. Delete a line to get its default; unknown or wrongly typed values are ignored (see spass.log).
enabled     = true

# The key: an action of the game's input map (SecondaryAction = right mouse button, PrimaryAction = left, Selection = the use key; the full list is
# risen.input.actions()) or a Windows virtual-key name (RButton, MButton, V, F5, ...). The RMB does nothing in the game while no weapon is drawn
# (unless a torch or carried item is lowered), so the default does not replace the use key.
key         = "SecondaryAction"
modifier    = "none"        # none | shift | ctrl | alt: must be held with the key

items       = true          # items lying on the ground
corpses     = true          # dead and knocked-out humans
chests      = true          # chests, cupboards, sarcophagi
keys        = true          # locked chests are opened with the key from the inventory (never lockpicked)
print       = true          # HUD line for picked-up ground items (looted stacks are printed by the game itself)
pickup_sound = true         # the sound of the take animation for ground items: the pick-up effect with the item material's transfer sound (apple, gold, wood, potion...)
pickup_sound_gap = 600      # ms: after one pick-up sound the next waits this long, so holding the key does not pile the sounds up (the items are still taken); 0 = a sound for every item

hold_repeat = true          # hold the key to take everything in reach, one target per repeat_ms
repeat_ms   = 80

# What the NPCs do when you take an item or open a chest/cupboard (theft to the game, but only inside a watched area such as a house; corpses and sarcophagi are no theft):
#   "assess" = the game's own reaction: the same check the animated take runs, so people who see it (their range, field of view and the area decide) comment, watch, threaten
#   "veto"   = decline while a living human who can see you is within witness_veto units (nothing is taken, the use key still walks over and lets people react)
#   "ignore" = nobody reacts (thieving is undetectable)
witness_mode = "assess"
witness_veto = 1000         # "veto" mode only: the radius in game units around the player; 0 = never veto
max_distance = 450          # the target must be this close (units)
