name: build

on:
  push:
  pull_request:
  # Nightly release (tag "nightly"): risen-spass.zip (layer + Mod Manager + quick loot) and risen-spass-tools-windows-x64.zip
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # Decides whether to build and whether to publish the nightly release. A scheduled run is skipped when the nightly
  # tag already points at the current commit; a manual run on the default branch always rebuilds and republishes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ON_DEFAULT: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          build=true
          release=false
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$ON_DEFAULT" = true ]; }; then
            release=true
            if [ "$EVENT" = schedule ]; then
              tagged=$(gh api "repos/$GH_REPO/commits/nightly" --jq .sha 2>/dev/null || true)
              if [ "$tagged" = "$GITHUB_SHA" ]; then
                echo "nightly is already at $GITHUB_SHA, nothing to do"
                build=false
                release=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  windows:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write   # only used by the nightly release steps
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # vcpkg binary packages (spdlog, minhook, sol2, tomlplusplus, luajit, the modkit libraries) are cached between runs
      - name: Prepare the vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      # Sets up the VS developer environment, including VCPKG_ROOT -> the vcpkg bundled with Visual Studio
      # (manifest mode only: it resolves the ports through "builtin-baseline" in vcpkg.json).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install --quiet ninja }
          ninja --version
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"

      # The "ninja" preset is meant for a Visual Studio developer shell (this is the same command sequence used locally).
      - name: Configure
        run: cmake --preset ninja
      - name: Build
        run: cmake --build build-ninja --config RelWithDebInfo
      - name: Unit tests (no game needed)
        run: build-ninja\RelWithDebInfo\spass_tests.exe

      # The Lua API description must match the bindings
      - name: API definitions are in sync
        run: python tools/check_luadefs.py

      - name: Install the Lua language server and type-check the example mods
        shell: pwsh
        run: |
          $url = (Invoke-RestMethod https://api.github.com/repos/LuaLS/lua-language-server/releases/latest).assets |
              Where-Object { $_.name -like '*win32-x64.zip' } | Select-Object -First 1 -ExpandProperty browser_download_url
          Invoke-WebRequest $url -OutFile $env:RUNNER_TEMP\luals.zip
          Expand-Archive $env:RUNNER_TEMP\luals.zip -DestinationPath $env:RUNNER_TEMP\luals
          Push-Location mods
          & "$env:RUNNER_TEMP\luals\bin\lua-language-server.exe" --check . --configpath .luarc.json --checklevel Warning
          Pop-Location

      - name: Package
        shell: pwsh
        run: |
          # package.ps1 expects the Visual Studio layout (build\RelWithDebInfo); the Ninja preset writes build-ninja\RelWithDebInfo
          New-Item -ItemType Directory -Force build\RelWithDebInfo | Out-Null
          Copy-Item build-ninja\RelWithDebInfo\sentry.dll, build-ninja\RelWithDebInfo\risen-pack2mod.exe build\RelWithDebInfo\
          .\scripts\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: risen-spass
          path: dist/*.zip

      # Nightly: two flat zips, replaced on every run
      #   risen-spass.zip                       sentry.dll, mods\modmanager\*, mods\quickloot\*
      #   risen-spass-tools-windows-x64.zip     risen-pack2mod.exe, risen-modkit.exe
      - name: Package the nightly
        if: needs.gate.outputs.release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'build-ninja\RelWithDebInfo'
          $out = New-Item -ItemType Directory -Force nightly
          $layer = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\nightly-layer"
          Copy-Item "$bin\sentry.dll" $layer
          New-Item -ItemType Directory -Force "$layer\mods" | Out-Null
          Copy-Item mods\modmanager, mods\quickloot "$layer\mods" -Recurse
          Compress-Archive -Path "$layer\*" -DestinationPath "$out\risen-spass.zip" -Force
          $tools = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\nightly-tools"
          Copy-Item "$bin\risen-pack2mod.exe", 'build-ninja\src\modkit\RelWithDebInfo\risen-modkit.exe' $tools
          Compress-Archive -Path "$tools\*" -DestinationPath "$out\risen-spass-tools-windows-x64.zip" -Force
          Get-ChildItem $out | Format-Table Name, Length

      - name: Publish the nightly release
        if: needs.gate.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate the release so the "nightly" tag moves to this commit
          gh release delete nightly --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $notes = "Automated build of $env:GITHUB_SHA ($(Get-Date -AsUTC -Format 'yyyy-MM-dd HH:mm') UTC).`n`n" +
                   "- **risen-spass.zip**: sentry.dll + mods/modmanager + mods/quickloot (first rename the game's <Risen>\bin\sentry.dll to sentry_orig.dll, then copy sentry.dll to <Risen>\bin and the mods to <Risen>\bin\spass\mods)`n" +
                   "- **risen-spass-tools-windows-x64.zip**: risen-pack2mod.exe, risen-modkit.exe"
          gh release create nightly nightly\risen-spass.zip nightly\risen-spass-tools-windows-x64.zip `
              --target $env:GITHUB_SHA --prerelease --title "Nightly ($($env:GITHUB_SHA.Substring(0, 7)))" --notes $notes
