name: build

on:
  push:
  pull_request:
  # Nightly release (tag "nightly"): risen-spass.zip (layer + Mod Manager + quick loot) and risen-spass-tools-windows-x64.zip
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A newer push to the same branch cancels the older run (nightly / manual runs are never cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  LUALS_VERSION: '3.19.2'   # pinned: a new LuaLS release may add diagnostics; keep in step with the local one

jobs:
  # Decides whether to build and whether to publish the nightly release. A scheduled run is skipped when the nightly
  # tag already points at the current commit; a manual run on the default branch always rebuilds and republishes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ON_DEFAULT: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          build=true
          release=false
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$ON_DEFAULT" = true ]; }; then
            release=true
            if [ "$EVENT" = schedule ]; then
              tagged=$(gh api "repos/$GH_REPO/commits/nightly" --jq .sha 2>/dev/null || true)
              if [ "$tagged" = "$GITHUB_SHA" ]; then
                echo "nightly is already at $GITHUB_SHA, nothing to do"
                build=false
                release=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # The Lua side needs no compiler: it runs next to the Windows build and reports even when the build fails
  lua:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Lua API description must match the bindings
      - name: API definitions are in sync
        run: python3 tools/check_luadefs.py

      - name: Type-check the mods with the Lua language server
        run: |
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" -o "$RUNNER_TEMP/luals.tar.gz"
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          cd mods
          "$RUNNER_TEMP/luals/bin/lua-language-server" --check . --configpath .luarc.json --checklevel Warning

  windows:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # vcpkg binary packages (spdlog, minhook, sol2, tomlplusplus, luajit, the modkit libraries; ~5 minutes to build
      # from source) are cached between runs. Restore and save are separate steps so the cache is stored right after
      # vcpkg installed the packages, even when a later step fails (actions/cache only saves after a green job).
      - name: Prepare the vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          # an older cache still has every package whose ABI did not change
          restore-keys: vcpkg-${{ runner.os }}-

      # Sets up the VS developer environment, including VCPKG_ROOT -> the vcpkg bundled with Visual Studio
      # (manifest mode only: it resolves the ports through "builtin-baseline" in vcpkg.json).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install --quiet ninja }
          ninja --version

      # The "ninja" preset is meant for a Visual Studio developer shell (this is the same command sequence used locally).
      - name: Configure
        run: cmake --preset ninja

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Build
        run: cmake --build build-ninja --config RelWithDebInfo
      - name: Unit tests (no game needed)
        run: build-ninja\RelWithDebInfo\spass_tests.exe
      - name: Unit tests of risen-modkit
        run: build-ninja\src\modkit\RelWithDebInfo\modkit_tests.exe

      - name: Package
        shell: pwsh
        run: |
          # package.ps1 expects the Visual Studio layout (build\RelWithDebInfo); the Ninja preset writes build-ninja\RelWithDebInfo
          New-Item -ItemType Directory -Force build\RelWithDebInfo | Out-Null
          Copy-Item build-ninja\RelWithDebInfo\sentry.dll, build-ninja\RelWithDebInfo\risen-pack2mod.exe build\RelWithDebInfo\
          .\scripts\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: risen-spass
          path: dist/*.zip

      # Nightly: two flat zips
      #   risen-spass.zip                       sentry.dll, mods\modmanager\*, mods\quickloot\*
      #   risen-spass-tools-windows-x64.zip     risen-pack2mod.exe, risen-modkit.exe
      - name: Package the nightly
        if: needs.gate.outputs.release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'build-ninja\RelWithDebInfo'
          $out = New-Item -ItemType Directory -Force nightly
          $layer = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\nightly-layer"
          Copy-Item "$bin\sentry.dll" $layer
          New-Item -ItemType Directory -Force "$layer\mods" | Out-Null
          Copy-Item mods\modmanager, mods\quickloot "$layer\mods" -Recurse
          Compress-Archive -Path "$layer\*" -DestinationPath "$out\risen-spass.zip" -Force
          $tools = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\nightly-tools"
          Copy-Item "$bin\risen-pack2mod.exe", 'build-ninja\src\modkit\RelWithDebInfo\risen-modkit.exe' $tools
          Compress-Archive -Path "$tools\*" -DestinationPath "$out\risen-spass-tools-windows-x64.zip" -Force
          Get-ChildItem $out | Format-Table Name, Length
      - name: Upload the nightly zips
        if: needs.gate.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly
          path: nightly/*.zip
          retention-days: 3

  # Publishes only when the build, the unit tests and the Lua checks all passed. The release is recreated so the
  # "nightly" tag moves to this commit.
  release:
    needs: [gate, lua, windows]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly
          path: nightly
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          notes="Automated build of ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M') UTC).

          - **risen-spass.zip**: sentry.dll + mods/modmanager + mods/quickloot (first rename the game's <Risen>\\bin\\sentry.dll to sentry_orig.dll, then copy sentry.dll to <Risen>\\bin and the mods to <Risen>\\bin\\spass\\mods)
          - **risen-spass-tools-windows-x64.zip**: risen-pack2mod.exe, risen-modkit.exe"
          gh release create nightly nightly/risen-spass.zip nightly/risen-spass-tools-windows-x64.zip \
              --target "$GITHUB_SHA" --prerelease --title "Nightly (${GITHUB_SHA::7})" --notes "$notes"
