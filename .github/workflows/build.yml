name: build

on:
  push:
  pull_request:
  # Nightly release (tag "nightly"): risen-spass.zip (layer + Mod Manager + quick loot) and risen-spass-tools-windows-x64.zip
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A newer push to the same branch cancels the older run (nightly / manual runs are never cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  LUALS_VERSION: '3.19.2'   # pinned: a new LuaLS release may add diagnostics; keep in step with the local one

# Jobs: gate -> (lua | layer | modkit, in parallel) -> release (nightly only).
# The two Windows jobs build with a compiler cache (.github/actions/windows-build): after the first run only the files
# whose source or headers changed are compiled.
jobs:
  # Decides whether to build and whether to publish the nightly release. A scheduled run is skipped when the nightly
  # tag already points at the current commit; a manual run on the default branch always rebuilds and republishes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ON_DEFAULT: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          build=true
          release=false
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$ON_DEFAULT" = true ]; }; then
            release=true
            if [ "$EVENT" = schedule ]; then
              tagged=$(gh api "repos/$GH_REPO/commits/nightly" --jq .sha 2>/dev/null || true)
              if [ "$tagged" = "$GITHUB_SHA" ]; then
                echo "nightly is already at $GITHUB_SHA, nothing to do"
                build=false
                release=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # The Lua side needs no compiler
  lua:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Lua API description must match the bindings
      - name: API definitions are in sync
        run: python3 tools/check_luadefs.py

      # the editor's language files: placeholders ({0}, %d) must match the English text
      - name: Editor language files are consistent
        run: python3 tools/i18n.py check

      - name: Type-check the mods with the Lua language server
        run: |
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" -o "$RUNNER_TEMP/luals.tar.gz"
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          cd mods
          "$RUNNER_TEMP/luals/bin/lua-language-server" --check . --configpath .luarc.json --checklevel Warning

  # The layer: sentry.dll, risen-pack2mod.exe, the unit tests; risen-spass.zip and the full release package
  layer:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-build
        with:
          name: layer
          configure-args: -DVCPKG_MANIFEST_FEATURES=   # without the modkit feature: no editor libraries to install
      - name: Build
        run: cmake --build build-ninja --config RelWithDebInfo
      - name: Unit tests (no game needed)
        run: build-ninja\RelWithDebInfo\spass_tests.exe

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'build-ninja\RelWithDebInfo'
          # risen-spass.zip: sentry.dll, mods\modmanager\*, mods\quickloot\*
          $layer = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\layer"
          Copy-Item "$bin\sentry.dll" $layer
          New-Item -ItemType Directory -Force "$layer\mods" | Out-Null
          Copy-Item mods\modmanager, mods\quickloot "$layer\mods" -Recurse
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$layer\*" -DestinationPath dist\risen-spass.zip -Force
          # the full package (install scripts, docs, example mods, Lua definitions): package.ps1 expects the Visual Studio layout
          New-Item -ItemType Directory -Force build\RelWithDebInfo | Out-Null
          Copy-Item "$bin\sentry.dll", "$bin\risen-pack2mod.exe" build\RelWithDebInfo\
          .\scripts\package.ps1 -Out dist\full -NoBuild -NoModkit   # built above; the editor is built by the modkit job
          Get-ChildItem dist -Recurse -Filter *.zip | Format-Table Name, Length
          "FULL_ZIP=$((Get-ChildItem dist\full -Filter *.zip | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV
      - name: Upload risen-spass.zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/risen-spass.zip
          archive: false
      - name: Upload the full package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.FULL_ZIP }}
          archive: false

  # The editor: risen-modkit.exe (+ risen-pack2mod.exe for the tools zip), the editor's unit tests
  modkit:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows-build
        with:
          name: modkit
      - name: Build
        run: cmake --build build-ninja --config RelWithDebInfo --target risen-modkit modkit_tests risen-pack2mod
      - name: Unit tests of risen-modkit
        run: build-ninja\src\modkit\RelWithDebInfo\modkit_tests.exe

      # risen-spass-tools-windows-x64.zip: risen-pack2mod.exe, risen-modkit.exe, lang/ (the editor's language files)
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\tools"
          Copy-Item build-ninja\RelWithDebInfo\risen-pack2mod.exe, build-ninja\src\modkit\RelWithDebInfo\risen-modkit.exe $tools
          Copy-Item build-ninja\src\modkit\RelWithDebInfo\lang -Destination $tools -Recurse
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$tools\*" -DestinationPath dist\risen-spass-tools-windows-x64.zip -Force
          Get-ChildItem dist | Format-Table Name, Length
      - name: Upload risen-spass-tools-windows-x64.zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/risen-spass-tools-windows-x64.zip
          archive: false

  # Publishes only when the builds, the unit tests and the Lua checks all passed. The release is recreated so the
  # "nightly" tag moves to this commit.
  release:
    needs: [gate, lua, layer, modkit]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: risen-spass.zip
          path: nightly
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: risen-spass-tools-windows-x64.zip
          path: nightly
          skip-decompress: true
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l nightly
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          notes="Automated build of ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M') UTC).

          - **risen-spass.zip**: sentry.dll + mods/modmanager + mods/quickloot (first rename the game's <Risen>\\bin\\sentry.dll to sentry_orig.dll, then copy sentry.dll to <Risen>\\bin and the mods to <Risen>\\bin\\spass\\mods)
          - **risen-spass-tools-windows-x64.zip**: risen-pack2mod.exe, risen-modkit.exe"
          gh release create nightly nightly/risen-spass.zip nightly/risen-spass-tools-windows-x64.zip \
              --target "$GITHUB_SHA" --prerelease --title "Nightly (${GITHUB_SHA::7})" --notes "$notes"
